[profile.default]
src = "contracts/src"
test = "contracts/test"
out = "out"
cache_path = "cache"
solc_version = "0.8.30"
# Pinned to match the deployed bytecode; newer Foundry defaults to osaka and would diverge.
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./packages/core/fixtures" }]
libs = ["lib"]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
